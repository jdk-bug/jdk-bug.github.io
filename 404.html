<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - jdk-bug</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #667eea; --primary-dark: #5a67d8; --secondary: #764ba2;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-primary: #2d3748; --text-secondary: #718096;
            --bg-card: white; --bg-body: #f7fafc;
            --shadow: rgba(0, 0, 0, 0.1); --border: #e2e8f0;
        }
        [data-theme="dark"] {
            --primary: #90cdf4; --primary-dark: #63b3ed; --secondary: #b794f4;
            --bg-gradient: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
            --text-primary: #f7fafc; --text-secondary: #cbd5e0;
            --bg-card: #2d3748; --bg-body: #1a202c;
            --shadow: rgba(0, 0, 0, 0.3); --border: #4a5568;
        }
        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
            line-height: 1.6; color: var(--text-primary); background: var(--bg-body);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .error-card {
            background: var(--bg-card); border-radius: 16px; box-shadow: 0 20px 60px var(--shadow);
            padding: 60px 40px; text-align: center; max-width: 520px; width: 100%;
        }
        .error-code {
            font-size: 7rem; font-weight: 700; background: var(--bg-gradient);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            line-height: 1.1; margin-bottom: 8px;
        }
        .error-title { font-size: 1.5rem; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; }
        .error-message { color: var(--text-secondary); font-size: 1rem; margin-bottom: 32px; }
        .error-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 8px;
            font-size: 0.95rem; font-weight: 500; text-decoration: none; transition: all 0.2s; cursor: pointer; border: none;
        }
        .btn-primary { background: var(--bg-gradient); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: var(--bg-body); color: var(--text-primary); border: 2px solid var(--border); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .search-box { position: relative; max-width: 360px; margin: 0 auto; }
        .search-box input {
            width: 100%; padding: 12px 16px 12px 44px; border: 2px solid var(--border); border-radius: 8px;
            font-size: 0.95rem; font-family: inherit; background: var(--bg-body); color: var(--text-primary);
            transition: border-color 0.2s;
        }
        .search-box input:focus { outline: none; border-color: var(--primary); }
        .search-box input::placeholder { color: var(--text-secondary); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 1rem; }
        @media (max-width: 480px) {
            .error-card { padding: 40px 24px; }
            .error-code { font-size: 5rem; }
            .error-title { font-size: 1.25rem; }
            .error-actions { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <main class="error-card">
        <div class="error-code">404</div>
        <h1 class="error-title">Page not found</h1>
        <p class="error-message">The page you are looking for does not exist or has been moved.</p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">Go Home</a>
            <a href="/blog.html" class="btn btn-secondary">Read the Blog</a>
        </div>
        <div class="search-box">
            <span class="search-icon">&#128269;</span>
            <input type="text" id="searchInput" placeholder="Search posts..." autocomplete="off">
        </div>
    </main>
    <script>
        (function() {
            var input = document.getElementById("searchInput");
            input.addEventListener("keydown", function(e) {
                if (e.key === 'Enter' && input.value.trim()) {
                    window.location.href = "/search.html?q=" + encodeURIComponent(input.value.trim());
                }
            });
        })();
    </script>
</body>
</html>
